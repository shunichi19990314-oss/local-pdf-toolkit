<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Merge, split, extract, rotate and reorganize PDFs 100% in your browser. Your files never leave your device. Offline-capable." />
  <title>Local PDF Toolkit</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M6 2h8l6 6v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
          <path fill="var(--bg-panel)" d="M14 2l6 6h-6z"/>
          <path fill="var(--accent)" d="M8.2 17.5v-5h1.6c1.5 0 2.5.9 2.5 2.5s-1 2.5-2.5 2.5H8.2zm1.3-1.1h.3c.8 0 1.2-.5 1.2-1.4s-.4-1.4-1.2-1.4h-.3v2.8z"/>
          <path fill="var(--accent)" d="M13.4 12.5h2.3c1.4 0 2.3.9 2.3 2.5s-.9 2.5-2.3 2.5h-2.3v-5zm1.3 1.1v2.8h.9c.7 0 1.1-.5 1.1-1.4s-.4-1.4-1.1-1.4h-.9z" transform="translate(-1.5 0) scale(.92)"/>
        </svg>
        <h1>Local PDF Toolkit</h1>
      </div>
      <div class="header-actions">
        <button id="btn-lang" class="ghost" title="Language / 言語">🌐</button>
        <button id="btn-theme" class="ghost" title="Theme / テーマ">🌓</button>
      </div>
    </header>

    <div class="privacy-banner" data-i18n-html="privacyBanner"></div>

    <section id="dropzone" class="dropzone">
      <svg viewBox="0 0 24 24" width="54" height="54" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.4" d="M12 16V4m0 0l-4 4m4-4l4 4"/>
        <path fill="none" stroke="currentColor" stroke-width="1.4" d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
      <h2 data-i18n="dropTitle">Drop PDFs here</h2>
      <p data-i18n="dropSub">They are opened locally in your browser — nothing is uploaded anywhere.</p>
      <div class="drop-actions">
        <button id="btn-choose" class="primary" data-i18n="choose">📄 Choose PDFs</button>
        <button id="btn-samples" class="ghost" data-i18n="samples">✨ Load sample PDFs</button>
      </div>
      <input type="file" id="file-input" accept="application/pdf,.pdf" multiple class="hidden" />
    </section>

    <section id="workspace" class="workspace hidden">
      <div class="files-row">
        <h3 data-i18n="files">Files</h3>
        <span class="hint" data-i18n="reorderHint">drag to reorder · merge order follows this list</span>
        <div id="file-list" class="file-list"></div>
      </div>

      <div class="toolbar">
        <input type="text" id="range-input" data-i18n-ph="rangePh" placeholder="e.g. 1-3, 5, 8-" autocomplete="off" spellcheck="false" />
        <button id="btn-range-apply" class="ghost small" data-i18n="apply">Select</button>
        <button id="btn-all" class="ghost small" data-i18n="all">All</button>
        <button id="btn-none" class="ghost small" data-i18n="none">None</button>
        <span id="sel-info" class="sel-info"></span>
        <span class="spacer"></span>
        <button id="btn-extract" data-i18n="extract">⬇ Extract selected</button>
        <button id="btn-delete" data-i18n="deletePages">✕ Delete selected</button>
        <div class="rot-group">
          <button id="btn-rotl" class="ghost" title="Rotate left / 左回転">⟲ 90°</button>
          <button id="btn-rotr" class="ghost" title="Rotate right / 右回転">⟳ 90°</button>
        </div>
        <button id="btn-reset" class="ghost" data-i18n="reset">↺ Reset</button>
        <button id="btn-export" class="primary" data-i18n="export">Export PDF</button>
      </div>

      <main id="grid" class="grid"></main>

      <footer class="statusbar">
        <span id="status"></span>
        <span class="spacer"></span>
        <span class="made">pdf-lib + pdf.js · <span data-i18n="noUpload">no upload, no server</span></span>
      </footer>
    </section>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
